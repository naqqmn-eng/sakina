name: Build Full Cache
on:
  workflow_dispatch:
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
      - name: Build once to fill cache
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi || true
          echo "CACHE READY"
          du -sh ~/.gradle ~/.pub-cache /usr/local/lib/android/sdk/build-tools || true
      - name: Pack full cache
        run: |
          mkdir -p /tmp/cache-pack
          tar -czf /tmp/cache-pack/gradle.tar.gz -C ~ .gradle || true
          tar -czf /tmp/cache-pack/pubcache.tar.gz -C ~ .pub-cache || true
          tar -czf /tmp/cache-pack/sdklibs.tar.gz -C /usr/local/lib/android/sdk build-tools platforms platform-tools || true
          ls -lh /tmp/cache-pack/
          cd /tmp/cache-pack && for f in *.tar.gz; do split -b 90M "$f" "$f.part-"; done
          ls -lh /tmp/cache-pack/
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cache-v1
          name: Full Build Cache v1
          body: Full Gradle + Pub + Android SDK cache - split 90M for resume download
          files: /tmp/cache-pack/*.part-*
